site_name: Lockness
site_description: Web2 scaling with explicit trust management — choose trusted roots and buy verifiable data capacity
site_url: https://lambdasistemi.github.io/lockness/
repo_url: https://github.com/lambdasistemi/lockness
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Trust and availability: design/trust-and-availability.md
  - User stories: stories/index.md
  - Architecture: architecture/system.md
  - Chainpoint sessions: design/chainpoints.md
  - Decisions and evidence: design/decisions.md
  - Roadmap: roadmap.md
plugins:
  - search
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/gh/paolino/dev-assets@0328b73b71788bb83848fe407dd04136a52c3697/mkdocs/docs/js/read-aloud.js
