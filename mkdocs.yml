site_name: Lockness
site_description: Web2 scaling with explicit trust management — choose trusted roots and buy verifiable data capacity
site_url: https://lambdasistemi.github.io/lockness/
repo_url: https://github.com/lambdasistemi/lockness
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.footer
    - content.code.copy
nav:
  - Start here:
      - Lockness: index.md
      - Trust and availability: design/trust-and-availability.md
      - User stories: stories/index.md
  - Understand the design:
      - Concepts: concepts.md
      - Architecture and proofs: architecture/system.md
      - Chainpoint sessions: design/chainpoints.md
  - Explore the projects:
      - CSMT-UTXO, MPFS and Singular: projects.md
      - Decisions and evidence: design/decisions.md
      - Delivery roadmap: roadmap.md
  - Inspect the model:
      - Root acceptance: model/index.md
plugins:
  - search
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/gh/paolino/dev-assets@0328b73b71788bb83848fe407dd04136a52c3697/mkdocs/docs/js/read-aloud.js
extra_css:
  - stylesheets/diagrams.css
validation:
  links:
    anchors: warn
hooks:
  - docs/hooks/diagram_paths.py
