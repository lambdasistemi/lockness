site_name: Lockness
site_description: Web2 scaling with explicit trust management — choose trusted roots and buy verifiable data capacity
site_url: https://lambdasistemi.github.io/lockness/
repo_url: https://github.com/lambdasistemi/lockness
theme:
  name: terminal
  custom_dir: docs/overrides
  palette: default
  features:
    - footer.prev_next
    - navigation.top.cursor_animation.hide
nav:
  - Start here:
      - Lockness: index.md
      - Trust and availability: design/trust-and-availability.md
      - User stories: stories/index.md
  - Understand the design:
      - Concepts: concepts.md
      - Architecture and proofs: architecture/system.md
      - Chainpoint sessions: design/chainpoints.md
  - Explore the projects:
      - CSMT-UTXO, MPFS and Singular: projects.md
      - Decisions and evidence: design/decisions.md
      - Delivery roadmap: roadmap.md
  - Inspect the model:
      - Root acceptance: model/index.md
plugins:
  - search
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mermaid.js?v=2a50635b636f64fe
  - javascripts/narration.js?v=157ba36ecb57f2f1
extra_css:
  - stylesheets/diagrams.css?v=2d9bb90e2ff068d7
  - stylesheets/terminal.css?v=445524ea612ee456
validation:
  links:
    anchors: warn
hooks:
  - docs/hooks/diagram_paths.py
